name: qa

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: |
          # Local sibling packages (`file:../..`-style deps) are hardlinked
          # into node_modules at `bun install` time. `tsup`'s `clean: true`
          # deletes and recreates `dist/` on every build (new inodes), which
          # silently detaches those hardlinks -- a dependent package's build
          # or `bun test` run can otherwise resolve a stale pre-build (or
          # previous-build) snapshot of its sibling instead of what was just
          # built. Re-running `bun install` after each build step (cheap: a
          # no-op relink when the lockfile hasn't changed) refreshes those
          # hardlinks before the next dependent package builds against them.
          bun run build
          bun install
          cd packages/react && bun run build
          cd ..
          bun install
          cd next && bun run build
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck || bun run typecheck:tsc
      - name: Test
        run: bun test
      - name: Unused code check
        run: bunx knip
