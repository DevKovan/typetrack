name: qa

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: |
          bun run build
          cd packages/react && bun run build
          cd ../next && bun run build
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck || bun run typecheck:tsc
      - name: Test
        run: bun test
      - name: Unused code check
        run: bunx knip
