name: qa

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        # Empirically verified (macOS, Bun 1.3.14): `packages/react` and
        # `packages/next`'s sibling-workspace dep (`@typetrack/react`,
        # `workspace:*`) is materialized as a live symlink into the sibling
        # package's own directory (e.g.
        # `packages/next/node_modules/@typetrack/react -> ../../../react`),
        # so it always sees that package's latest built `dist/` with no
        # relink needed -- this is what fixed the original "Cannot find
        # module '@typetrack/react'" failure. Root `typetrack`, however,
        # cannot be depended on via `workspace:*` at all: Bun only resolves
        # `workspace:*` for packages matched by the `workspaces` glob
        # (`packages/*`), and the monorepo root is not itself a glob
        # member (verified: `workspace:*` install fails outright if
        # attempted for it), so it stays on `file:../..`. On macOS that
        # materializes as a *clonefile snapshot* (not a hardlink) taken at
        # `bun install` time, under
        # `node_modules/.bun/typetrack@root/node_modules/typetrack` -- a
        # real, independent directory, not a live link back to the repo
        # root (on Linux, where clonefile isn't available, Bun's default
        # backend falls back to a hardlink of the same snapshot-at-install
        # semantics). `tsup`'s `clean: true` deletes and recreates root
        # `dist/` on every build, and that snapshot/hardlink is never
        # auto-refreshed, so `packages/react`'s `tsup --dts` build (it
        # re-exports types from `typetrack`) fails to resolve `typetrack`'s
        # types unless `bun install` is re-run after root is built to
        # refresh it. `bun run build:all` (root package.json) already does
        # this internally (`build && bun install && build react && build
        # next`), so this CI step only needs to invoke it once.
        run: bun run build:all
      - name: Bundle size
        # size-limit's @size-limit/file plugin (root `.size-limit.json`)
        # checks already-built `dist/` file sizes directly -- no re-bundling
        # of its own -- so it only needs the "Build" step above to have run,
        # and has no dependency on Lint/Typecheck/Test below. Placed here,
        # immediately after Build, rather than at the end of the job.
        run: bun run size
      - name: e2e
        # `e2e/`'s two Playwright specs need `dist/index.global.js` (the
        # IIFE global bundle, loaded via a real `<script>` tag) and the
        # `flushOnUnload` `pagehide`/`sendBeacon` behavior, both of which
        # only require root `typetrack`'s `dist/` output -- already produced
        # by the "Build" step's `bun run build:all` (root `tsup` build runs
        # first inside that script, before any `packages/*` sub-build).
        run: |
          bunx playwright install --with-deps chromium
          cd e2e && bun run test
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck || bun run typecheck:tsc
      - name: Typecheck (Svelte templates)
        # `tsc`/`tsgo` (invoked by the "Typecheck" step above, via the root
        # `bun run typecheck`/`typecheck:tsc` scripts) never parse `.svelte`
        # syntax at all, so `packages/svelte/src/AnalyticsProvider.svelte`'s
        # own `<script>` block gets zero type-checking from that step alone.
        # `svelte-check` (Svelte's own official type-checking tool) is this
        # package's own, additional, additive fix -- run as one targeted,
        # per-package invocation here, mirroring how the Build step already
        # runs targeted per-package commands (via `bun run build:all`) for
        # `packages/react`/`packages/next`/`packages/vue`/`packages/nuxt`.
        run: cd packages/svelte && bun run typecheck:svelte
      - name: Test
        # `--conditions=browser`: `svelte`'s own `package.json` `"exports"`
        # field branches "." on a `"browser"` vs `"worker"`/`"default"`
        # condition, and Bun (a server-like runtime) does not include
        # `"browser"` in its default resolution conditions -- without this
        # flag, `packages/svelte`'s own `@testing-library/svelte`-based
        # tests resolve Svelte's *server-side* `mount` (throws
        # `lifecycle_function_unavailable`) instead of its client-side one.
        # Confirmed by hand to be a safe, no-op addition for every other
        # package's own tests (none of their dependencies branch on a
        # `"browser"` export condition the way `svelte` does). Mirrors root
        # `package.json`'s own `"test"` script, including
        # `--path-ignore-patterns=e2e/**`: `bun test`'s default file
        # discovery matches `*.spec.ts` (not just `*.test.ts`), which would
        # otherwise sweep up `e2e/tests/*.spec.ts` -- real `@playwright/test`
        # specs, meaningless (and broken) under `bun:test`'s own runner --
        # into this repo-wide run. Confirmed by hand: without this flag,
        # `bun test` both fails to run the Playwright specs and produces
        # unrelated collateral failures elsewhere in the same run.
        run: bun test --conditions=browser --path-ignore-patterns='e2e/**'
      - name: Unused code check
        run: bunx knip
